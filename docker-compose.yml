version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: backend-truck-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-truckdb}
      POSTGRES_USER: ${DATABASE_USER:-truck_admin}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-truck_password}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-truck_admin} -d ${DATABASE_NAME:-truckdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
