version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: truck-postgres
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-truckdb}
      POSTGRES_USER: ${DATABASE_USER:-truck_admin}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - truck-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-truck_admin} -d ${DATABASE_NAME:-truckdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: truck-backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-truck_admin}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME:-truckdb}
      DATABASE_SSL: "false"
      CORS_ORIGINS: ${CORS_ORIGINS}
      ENABLE_SWAGGER: "false"
      # As variáveis NFE_* vêm do .env.production (env_file) e não são repetidas
      # aqui de propósito: o bloco environment sobrepõe o env_file, e um valor
      # vazio apagaria a senha do certificado.
    volumes:
      # Certificado A1 montado somente leitura; nunca entra na imagem.
      - ./certs:/app/certs:ro
    networks:
      - truck-network
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: truck-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - truck-network
    depends_on:
      - backend

volumes:
  postgres_data:
    name: truck_postgres_data

networks:
  truck-network:
    driver: bridge
